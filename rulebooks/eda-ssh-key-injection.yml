---
- name: Debug Injected SSH Key
  hosts: localhost
  sources:
    - ansible.eda.range:
        limit: 5
  rules:
    - name: Controller Rule
      condition: event.i == 1
      action:
        run_module: 
          name: ansible.builtin.command 
          module_args: 
            cmd: "cat {{ lookup('env', 'SSH\_KEY\_PATH') }}"
