[pytest]
# Pytest configuration for filter plugin tests

# Test discovery patterns
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Directories to search for tests
testpaths = unit

# Output options
addopts =
    --verbose
    --tb=short
    --strict-markers
    --disable-warnings
    --cov=filter_plugins
    --cov-report=term-missing
    --cov-report=html:filter_plugins/tests/coverage_html
    --cov-report=xml:filter_plugins/tests/coverage.xml

# Markers for categorizing tests
markers =
    unit: Unit tests for individual filter functions
    integration: Integration tests using Ansible playbooks
    slow: Tests that take a long time to run

# Minimum coverage percentage
[coverage:run]
source = filter_plugins
omit =
    */tests/*
    */test_*

[coverage:report]
precision = 2
show_missing = True
skip_covered = False

[coverage:html]
directory = filter_plugins/tests/coverage_html
